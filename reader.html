<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#073c2e">
  <title>Журнал — ЭКО-культура media</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--green:#124634;--deep:#073c2e;--cream:#f2f7eb;--ink:#193f32;--muted:#62786d;--line:rgba(18,70,52,.2)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--cream);color:var(--ink);font-family:Manrope,Arial,sans-serif}
    .top{min-height:70px;padding:14px clamp(20px,5vw,64px);display:flex;align-items:center;justify-content:space-between;gap:18px;background:var(--deep);color:var(--cream)}
    .brand{display:flex;align-items:center;gap:12px;color:inherit;font-size:12px;letter-spacing:.16em;text-decoration:none;text-transform:uppercase;white-space:nowrap}.brand img{width:132px;max-height:42px;object-fit:contain}
    .back{font-size:10px;letter-spacing:.12em;text-decoration:none;text-transform:uppercase}
    main{width:min(1150px,100%);margin:auto;padding:clamp(24px,5vw,50px) clamp(16px,4vw,42px) 40px}
    .heading{text-align:center}.eyebrow{color:var(--muted);font-size:10px;letter-spacing:.16em;text-transform:uppercase}.heading h1{margin:8px 0 0;color:var(--green);font:600 clamp(27px,4vw,42px)/1.1 Oswald,Impact,sans-serif;text-transform:uppercase}
    .status{min-height:22px;margin:14px 0 18px;color:var(--muted);font-size:12px;text-align:center}
    .viewer{width:min(100%,880px);min-height:260px;margin:0 auto;padding:14px;display:grid;place-items:center;overflow:hidden;border:1px solid rgba(18,70,52,.12);border-radius:8px;background:#e6eadc;box-shadow:0 14px 36px rgba(15,45,32,.08)}
    #book{width:100%;margin:auto}.page{background:#fff;overflow:hidden}.page img{display:block;width:100%;height:100%;object-fit:contain}.page.--hard{background:#f7f7f1}.page.--hard img{box-shadow:0 2px 10px rgba(0,0,0,.16)}
    .controls{margin:18px auto 0;display:flex;align-items:center;justify-content:center;gap:12px}.control{width:42px;height:42px;display:grid;place-items:center;border:1px solid var(--green);border-radius:50%;color:var(--green);background:transparent;font-size:20px;cursor:pointer}.control:hover:not(:disabled){color:#fff;background:var(--green)}.control:disabled{opacity:.35;cursor:default}.counter{min-width:104px;color:var(--green);font-size:12px;text-align:center;font-variant-numeric:tabular-nums}
    .tools{margin:14px auto 0;display:flex;justify-content:center;gap:18px}.tools a{color:var(--green);font-size:10px;letter-spacing:.1em;text-decoration:none;text-transform:uppercase}.tools a:hover{text-decoration:underline;text-underline-offset:4px}
    .error{max-width:660px;margin:20px auto;padding:18px 20px;border:1px solid rgba(128,62,39,.25);border-radius:6px;color:#633d2c;background:#fff9f2;font-size:13px;line-height:1.7;text-align:center}.hidden{display:none!important}
    footer{padding:20px clamp(20px,5vw,64px);border-top:1px solid var(--line);color:var(--muted);font-size:11px;text-align:center}
    @media(max-width:600px){.top{align-items:flex-start;flex-direction:column;padding-block:16px}.viewer{padding:7px;min-height:220px}.controls{gap:9px}.control{width:40px;height:40px}.tools{flex-wrap:wrap}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <header class="top">
    <a class="brand" href="./"><img src="assets/logo_beliy.png" alt="ЭКО-культура"><span>media</span></a>
    <a class="back" id="backLink" href="./">← Вернуться к журналам</a>
  </header>
  <main>
    <div class="heading"><div class="eyebrow">ЭКО-культура media</div><h1 id="title">Журнал</h1></div>
    <div class="status" id="status" role="status" aria-live="polite">Загружаю выпуск…</div>
    <div class="viewer"><div id="book"></div></div>
    <div class="controls" aria-label="Управление страницами">
      <button class="control" id="previous" type="button" aria-label="Предыдущая страница" disabled>‹</button>
      <span class="counter" id="counter">— / —</span>
      <button class="control" id="next" type="button" aria-label="Следующая страница" disabled>›</button>
    </div>
    <div class="tools"><a id="download" href="#" download>Скачать PDF</a><a id="openPdf" href="#" target="_blank" rel="noopener">Открыть PDF отдельно</a></div>
    <div class="error hidden" id="error"></div>
  </main>
  <footer>Листайте страницы кнопками, стрелками клавиатуры или касанием экрана.</footer>
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
  <script type="module">
    import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@6.4.299/build/pdf.mjs';

    const params = new URLSearchParams(location.search);
    const pdfPath = params.get('pdf');
    const title = params.get('title') || 'Журнал';
    const titleNode = document.getElementById('title');
    const status = document.getElementById('status');
    const errorBox = document.getElementById('error');
    const bookNode = document.getElementById('book');
    const prevButton = document.getElementById('previous');
    const nextButton = document.getElementById('next');
    const counter = document.getElementById('counter');
    titleNode.textContent = title;
    document.title = `${title} — ЭКО-культура media`;

    if (pdfPath) {
      const pdfUrl = new URL(pdfPath, document.baseURI).href;
      document.getElementById('download').href = pdfUrl;
      document.getElementById('openPdf').href = pdfUrl;
    }

    function showError(message) {
      status.textContent = '';
      errorBox.textContent = message;
      errorBox.classList.remove('hidden');
    }

    function updateControls(page, total) {
      counter.textContent = `${page + 1} / ${total}`;
      prevButton.disabled = page <= 0;
      nextButton.disabled = page >= total - 1;
    }

    async function makePageImage(pdfPage) {
      const base = pdfPage.getViewport({ scale: 1 });
      const scale = Math.min(1100 / base.width, 1.8);
      const viewport = pdfPage.getViewport({ scale });
      const canvas = document.createElement('canvas');
      const context = canvas.getContext('2d', { alpha: false });
      canvas.width = Math.ceil(viewport.width);
      canvas.height = Math.ceil(viewport.height);
      await pdfPage.render({ canvasContext: context, viewport }).promise;
      const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', .84));
      canvas.width = 0;
      canvas.height = 0;
      if (!blob) throw new Error('Не удалось подготовить изображение страницы.');
      return URL.createObjectURL(blob);
    }

    function onFlip(event) {
      updateControls(event.data, window.ecoPageFlip.getPageCount());
    }

    async function startReader() {
      if (!pdfPath) throw new Error('Не указан файл журнала. Вернитесь в архив и откройте выпуск ещё раз.');
      if (!window.St?.PageFlip) throw new Error('Не загрузился модуль перелистывания. Обновите страницу или попробуйте позже.');
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@6.4.299/build/pdf.worker.mjs';
      const loadingTask = pdfjsLib.getDocument({ url: new URL(pdfPath, document.baseURI).href });
      const pdf = await loadingTask.promise;
      const pageImages = [];
      for (let number = 1; number <= pdf.numPages; number++) {
        status.textContent = `Подготавливаю страницы: ${number} из ${pdf.numPages}`;
        pageImages.push(await makePageImage(await pdf.getPage(number)));
      }
      status.textContent = '';

      const firstPage = await pdf.getPage(1);
      const firstSize = firstPage.getViewport({ scale: 1 });
      const width = 560;
      const height = Math.round(width * firstSize.height / firstSize.width);
      const pages = pageImages.map((src, index) => {
        const page = document.createElement('div');
        page.className = 'page';
        if (index === 0 || index === pageImages.length - 1) page.dataset.density = 'hard';
        const image = document.createElement('img');
        image.src = src;
        image.alt = `${title}, страница ${index + 1}`;
        image.draggable = false;
        page.append(image);
        return page;
      });

      const pageFlip = new window.St.PageFlip(bookNode, {
        width,
        height,
        size: 'stretch',
        minWidth: 280,
        maxWidth: 560,
        minHeight: 380,
        maxHeight: 800,
        showCover: true,
        usePortrait: true,
        drawShadow: true,
        maxShadowOpacity: .28,
        flippingTime: 850,
        mobileScrollSupport: true,
        autoSize: true
      });
      pageFlip.loadFromHTML(pages);
      window.ecoPageFlip = pageFlip;
      pageFlip.on('flip', onFlip);
      updateControls(0, pageImages.length);
      prevButton.disabled = true;
      nextButton.disabled = pageImages.length <= 1;
      prevButton.addEventListener('click', () => pageFlip.flipPrev('top'));
      nextButton.addEventListener('click', () => pageFlip.flipNext('top'));
      document.addEventListener('keydown', event => {
        if (event.key === 'ArrowLeft') pageFlip.flipPrev('top');
        if (event.key === 'ArrowRight') pageFlip.flipNext('top');
      });
      window.addEventListener('pagehide', () => pageImages.forEach(URL.revokeObjectURL), { once: true });
    }

    startReader().catch(error => showError(`${error.message} Если проблема повторится, воспользуйтесь ссылкой «Открыть PDF отдельно».`));
  </script>
</body>
</html>
